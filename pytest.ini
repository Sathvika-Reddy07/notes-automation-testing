[pytest]

# ✅ ADD THIS LINE (CRITICAL FIX)
pythonpath = .

# Test discovery
testpaths = tests

# Naming conventions
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add options
addopts =
    -v
    --alluredir=reports
    --tb=short

# Markers
markers =
    ui: UI tests
    api: API tests
    e2e: End-to-End tests
    negative: Negative test cases